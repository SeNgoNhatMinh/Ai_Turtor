name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "Ai_Turtor_FE/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Ai_Turtor_FE/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ai_Turtor_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Ai_Turtor_FE/package-lock.json
      - run: npm ci
      - run: npm run check
