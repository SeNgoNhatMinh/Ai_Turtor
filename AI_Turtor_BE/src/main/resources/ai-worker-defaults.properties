# Import these values into application.properties only if/when the worker
# orchestration is enabled by a caller. No existing RAG path depends on them.
ai.worker.pool.core-size=3
ai.worker.pool.max-size=6
ai.worker.pool.queue-capacity=24
ai.worker.timeout-seconds=25

# Prompt Guard models are input-security classifiers, not answer-generation
# models. If enabled later, configure separate Groq keys via environment or a
# secret manager; never commit API keys.
ai.worker.prompt-guard.enabled=false
ai.worker.prompt-guard.worker-2-model=meta-llama/llama-prompt-guard-2-22m
ai.worker.prompt-guard.worker-3-model=meta-llama/llama-prompt-guard-2-86m
