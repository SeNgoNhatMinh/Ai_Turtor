<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1f55" flood-opacity=".13"/></filter>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#344054" stroke-width="1.3"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0b1f55}.subtitle{font:500 18px Arial,sans-serif;fill:#53627a}
      .boundary{fill:#fff;stroke:#183b8f;stroke-width:2.3}.boundaryTitle{font:700 20px Arial,sans-serif;fill:#183b8f}
      .uc{stroke-width:2;filter:url(#shadow)}.ucText{font:600 15px Arial,sans-serif;fill:#16213d;text-anchor:middle}.ucId{font:700 14px Arial,sans-serif;text-anchor:middle}
      .studentUc{fill:#edf9f1;stroke:#16834b}.teacherUc{fill:#fff5e8;stroke:#d97706}.knowledgeUc{fill:#f5efff;stroke:#7445b8}.systemUc{fill:#eef4ff;stroke:#2459c4}
      .assoc{fill:none;stroke-width:2}.studentLine{stroke:#16834b}.teacherLine{stroke:#7445b8}.seniorLine{stroke:#d97706}.adminLine{stroke:#a51d34}.handlerLine{stroke:#183b8f}.aiLine{stroke:#008b8b}
      .rel{fill:none;stroke:#344054;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#openArrow)}.relLabel{font:600 12px Arial,sans-serif;fill:#344054}
      .actorName{font:700 16px Arial,sans-serif;text-anchor:middle}.actorNote{font:13px Arial,sans-serif;fill:#53627a;text-anchor:middle}
      .groupLabel{font:700 13px Arial,sans-serif;letter-spacing:.8px}.note{font:13px Arial,sans-serif;fill:#344054}.legend{font:600 12px Arial,sans-serif;fill:#344054}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="46" class="title" text-anchor="middle">AI TUTOR PLATFORM — CORE USE CASE DIAGRAM</text>
  <text x="960" y="76" class="subtitle" text-anchor="middle">6 Actors · 12 Core Features · Grounded Learning · Personalization · Human-in-the-loop</text>

  <rect x="210" y="105" width="1500" height="865" rx="10" class="boundary"/>
  <rect x="780" y="91" width="360" height="34" rx="7" fill="#183b8f"/>
  <text x="960" y="114" class="boundaryTitle" fill="#fff" text-anchor="middle" style="fill:#fff">AI TUTOR PLATFORM</text>

  <text x="440" y="145" class="groupLabel" fill="#16834b" text-anchor="middle">LEARNER EXPERIENCE</text>
  <text x="840" y="145" class="groupLabel" fill="#2459c4" text-anchor="middle">TUTOR CORE</text>
  <text x="1310" y="145" class="groupLabel" fill="#7445b8" text-anchor="middle">HUMAN GOVERNANCE &amp; IMPROVEMENT</text>

  <!-- Student-facing use cases -->
  <g><ellipse cx="440" cy="210" rx="145" ry="48" class="uc studentUc"/><text x="440" y="198" class="ucId" fill="#16834b">UC-01</text><text x="440" y="220" class="ucText"><tspan x="440">Phiên học với AI Tutor</tspan><tspan x="440" dy="19">có căn cứ</tspan></text></g>
  <g><ellipse cx="440" cy="330" rx="130" ry="41" class="uc studentUc"/><text x="440" y="323" class="ucId" fill="#16834b">UC-04</text><text x="440" y="345" class="ucText">Code Mentor</text></g>
  <g><ellipse cx="440" cy="445" rx="130" ry="43" class="uc studentUc"/><text x="440" y="435" class="ucId" fill="#16834b">UC-05</text><text x="440" y="457" class="ucText"><tspan x="440">Kiểm tra hiểu &amp;</tspan><tspan x="440" dy="18">quiz thích ứng</tspan></text></g>
  <g><ellipse cx="440" cy="565" rx="130" ry="43" class="uc studentUc"/><text x="440" y="555" class="ucId" fill="#16834b">UC-06</text><text x="440" y="577" class="ucText"><tspan x="440">Bài tập, bài nộp</tspan><tspan x="440" dy="18">và chấm bài</tspan></text></g>
  <g><ellipse cx="440" cy="690" rx="140" ry="46" class="uc teacherUc"/><text x="440" y="678" class="ucId" fill="#d97706">UC-07</text><text x="440" y="701" class="ucText"><tspan x="440">Chuyển giao Teacher</tspan><tspan x="440" dy="18">và chat trực tiếp</tspan></text></g>
  <g><ellipse cx="440" cy="825" rx="130" ry="43" class="uc systemUc"/><text x="440" y="815" class="ucId" fill="#2459c4">UC-11</text><text x="440" y="837" class="ucText"><tspan x="440">Đa phương thức</tspan><tspan x="440" dy="18">Text + TTS</tspan></text></g>

  <!-- Tutor core -->
  <g><ellipse cx="840" cy="235" rx="150" ry="48" class="uc teacherUc"/><text x="840" y="223" class="ucId" fill="#d97706">UC-02</text><text x="840" y="246" class="ucText"><tspan x="840">Cá nhân hóa cách dạy</tspan><tspan x="840" dy="18">theo từng Student</tspan></text></g>
  <g><ellipse cx="840" cy="420" rx="150" ry="51" class="uc systemUc"/><text x="840" y="405" class="ucId" fill="#2459c4">UC-03</text><text x="840" y="429" class="ucText"><tspan x="840">Hybrid Retrieval &amp; Evidence</tspan><tspan x="840" dy="18">Child chunk → Parent section</tspan></text></g>
  <g><ellipse cx="840" cy="650" rx="150" ry="50" class="uc systemUc"/><text x="840" y="637" class="ucId" fill="#2459c4">UC-12</text><text x="840" y="660" class="ucText"><tspan x="840">Điều phối AI, retry/failover</tspan><tspan x="840" dy="18">và quan sát vận hành</tspan></text></g>

  <!-- Human governance -->
  <g><ellipse cx="1310" cy="280" rx="155" ry="50" class="uc knowledgeUc"/><text x="1310" y="267" class="ucId" fill="#7445b8">UC-08</text><text x="1310" y="290" class="ucText"><tspan x="1310">Phản hồi câu trả lời &amp;</tspan><tspan x="1310" dy="18">vòng lặp cải tiến tri thức</tspan></text></g>
  <g><ellipse cx="1310" cy="520" rx="155" ry="50" class="uc knowledgeUc"/><text x="1310" y="507" class="ucId" fill="#7445b8">UC-09</text><text x="1310" y="530" class="ucText"><tspan x="1310">Expert co-training &amp;</tspan><tspan x="1310" dy="18">đánh giá AI bằng holdout</tspan></text></g>
  <g><ellipse cx="1310" cy="780" rx="155" ry="50" class="uc teacherUc"/><text x="1310" y="767" class="ucId" fill="#d97706">UC-10</text><text x="1310" y="790" class="ucText"><tspan x="1310">Công bố syllabus &amp;</tspan><tspan x="1310" dy="18">học liệu chuẩn</tspan></text></g>

  <!-- Associations: Student -->
  <path d="M145 300 H245 V210 H295" class="assoc studentLine"/><path d="M245 300 V825" class="assoc studentLine"/>
  <path d="M245 330 H310" class="assoc studentLine"/><path d="M245 445 H310" class="assoc studentLine"/><path d="M245 565 H310" class="assoc studentLine"/><path d="M245 690 H300" class="assoc studentLine"/><path d="M245 825 H310" class="assoc studentLine"/>
  <!-- Associations: Teacher -->
  <path d="M145 625 H195 V565 H310" class="assoc teacherLine"/><path d="M195 625 V690 H300" class="assoc teacherLine"/>
  <path d="M195 625 V910 H1010 V280 H1155" class="assoc teacherLine"/><path d="M1010 520 H1155" class="assoc teacherLine"/>
  <path d="M195 625 V900 H650 V235 H690" class="assoc teacherLine"/>
  <!-- Associations: Senior -->
  <path d="M145 875 H1080 V280 H1155" class="assoc seniorLine"/><path d="M1080 520 H1155" class="assoc seniorLine"/>
  <!-- Associations: external right actors -->
  <path d="M1775 210 H1650 V650 H990" class="assoc handlerLine"/>
  <path d="M1775 455 H1600 V210 H585" class="assoc aiLine"/><path d="M1600 455 V445 H570" class="assoc aiLine"/><path d="M1600 455 V520 H1465" class="assoc aiLine"/>
  <path d="M1775 810 H1600 V780 H1465" class="assoc adminLine"/>

  <!-- Include relations from the learning session -->
  <path d="M585 198 C640 180 660 205 690 220" class="rel"/><text x="618" y="179" class="relLabel">«include»</text>
  <path d="M575 230 C660 285 655 365 694 394" class="rel"/><text x="626" y="307" class="relLabel">«include»</text>
  <path d="M555 245 C640 420 630 575 696 626" class="rel"/><text x="610" y="515" class="relLabel">«include»</text>
  <!-- Optional extensions -->
  <path d="M440 289 V259" class="rel"/><text x="454" y="278" class="relLabel">«extend» [CODE]</text>
  <path d="M350 657 C300 560 300 325 360 250" class="rel"/><text x="266" y="507" class="relLabel">«extend» [cần Teacher]</text>
  <path d="M390 784 C330 650 335 355 382 254" class="rel"/><text x="302" y="765" class="relLabel">«extend» [chọn Đọc]</text>
  <path d="M1155 264 C980 180 760 170 585 202" class="rel"/><text x="950" y="174" class="relLabel">«extend» [sau câu trả lời]</text>

  <!-- Actor drawings -->
  <g stroke="#16834b" stroke-width="3" fill="none"><circle cx="95" cy="225" r="14"/><path d="M95 239 V283 M68 253 H122 M95 283 L70 315 M95 283 L120 315"/></g><text x="95" y="341" class="actorName" fill="#16834b">STUDENT</text><text x="95" y="360" class="actorNote">Học · luyện tập · phản hồi</text>
  <g stroke="#7445b8" stroke-width="3" fill="none"><circle cx="95" cy="550" r="14"/><path d="M95 564 V608 M68 578 H122 M95 608 L70 640 M95 608 L120 640"/></g><text x="95" y="667" class="actorName" fill="#7445b8">TEACHER</text><text x="95" y="686" class="actorNote">Dạy · hỗ trợ · đánh giá</text>
  <g stroke="#d97706" stroke-width="3" fill="none"><circle cx="95" cy="800" r="14"/><path d="M95 814 V858 M68 828 H122 M95 858 L70 890 M95 858 L120 890"/></g><text x="95" y="918" class="actorName" fill="#d97706">SENIOR</text><text x="95" y="937" class="actorNote">Thẩm định tri thức &amp; AI</text>
  <g stroke="#183b8f" stroke-width="3" fill="none"><circle cx="1815" cy="140" r="14"/><path d="M1815 154 V198 M1788 168 H1842 M1815 198 L1790 230 M1815 198 L1840 230"/></g><text x="1815" y="256" class="actorName" fill="#183b8f">SYSTEM HANDLER</text><text x="1815" y="275" class="actorNote">n8n / Orchestrator</text>
  <g stroke="#008b8b" stroke-width="3" fill="none"><circle cx="1815" cy="385" r="14"/><path d="M1815 399 V443 M1788 413 H1842 M1815 443 L1790 475 M1815 443 L1840 475"/></g><text x="1815" y="501" class="actorName" fill="#008b8b">AI SERVICE</text><text x="1815" y="520" class="actorNote">LLM / Model provider</text>
  <g stroke="#a51d34" stroke-width="3" fill="none"><circle cx="1815" cy="740" r="14"/><path d="M1815 754 V798 M1788 768 H1842 M1815 798 L1790 830 M1815 798 L1840 830"/></g><text x="1815" y="856" class="actorName" fill="#a51d34">ADMIN</text><text x="1815" y="875" class="actorNote">Nhà trường / học liệu chuẩn</text>

  <!-- Legend and scope note -->
  <rect x="255" y="905" width="690" height="45" rx="8" fill="#f8fafc" stroke="#aab7cc"/>
  <text x="275" y="933" class="legend">LEGEND</text><ellipse cx="365" cy="928" rx="30" ry="13" fill="#edf9f1" stroke="#16834b"/><text x="405" y="933" class="legend">Use Case</text>
  <line x1="500" y1="928" x2="555" y2="928" stroke="#344054" stroke-width="2"/><text x="565" y="933" class="legend">Association</text>
  <line x1="665" y1="928" x2="725" y2="928" class="rel"/><text x="735" y="933" class="legend">«include» / «extend»</text>
  <rect x="1020" y="895" width="640" height="58" rx="8" fill="#fffaf0" stroke="#d4a72c"/>
  <text x="1040" y="918" class="note">Phạm vi: AI và n8n được xem là external supporting actors.</text>
  <text x="1040" y="939" class="note">Voice hiện tại = Text + TTS; chưa tuyên bố STT/realtime voice conversation.</text>
  <text x="960" y="1030" class="subtitle" text-anchor="middle">Use Case mô tả mục tiêu nghiệp vụ (what). RAG, embedding, database và workflow nội bộ được phân rã ở Architecture / Activity / Sequence Diagram.</text>
</svg>
