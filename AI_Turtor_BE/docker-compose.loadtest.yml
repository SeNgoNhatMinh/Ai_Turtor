# Load/chaos-test override, layered on top of the offline stack:
#   scripts/loadtest/compose.sh up -d ai-tutor-api
#
# - The API uses the isolated copies tutor_db_loadtest (URI in .env.loadtest) and
#   course_material_vectors_embeddinggemma_768_loadtest, so random writes never
#   reach the real database or vector index.
# - Chat uses the cloud providers from .env.deploy, because one Mac running Ollama
#   cannot answer hundreds of concurrent questions. Embeddings stay local
#   (embeddinggemma), so the already-built local Elasticsearch index is reused.
# Return to offline afterwards with: scripts/offline/compose.sh up -d ai-tutor-api
services:
  ai-tutor-api:
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:?SPRING_DATA_MONGODB_URI is required}
      # Clone of the local vector index (ES _clone), so chaos calls cannot change the real one.
      ELASTICSEARCH_INDEX: course_material_vectors_embeddinggemma_768_loadtest
      OLLAMA_CHAT_ENABLED: "false"
      GROQ_ENABLED: "true"
      GROQ_WORKER1_ENABLED: "true"
      NVIDIA_NIM_ENABLED: "true"
      OPENROUTER_ENABLED: "true"
      OPENROUTER_FALLBACK_ENABLED: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_FALLBACK_API_KEY: ${OPENROUTER_FALLBACK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_WORKER1_API_KEY: ${GROQ_WORKER1_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
